# DOSBox-X config for running dojs-os UNZIPPED from the source tree —
# live debugging: edit .js files on the host, re-run, no zip rebuild.
#
# Usage (host):
#   dosbox-x -conf dosbox/dosbox-x-dev.conf
#
# Mounts vendor/dojs as C: (DOJS.EXE etc.) and the repo root as D:,
# then calls D:\RUN.BAT. The DOjS loader needs JSBOOT.ZIP (or JSBOOT\)
# in the current directory, so RUN.BAT copies C:\JSBOOT.ZIP into the
# repo root once (untracked, see .gitignore). Remove it with
#   del D:\JSBOOT.ZIP
# to force a fresh copy on the next run.

[sdl]
output = opengl
autolock = true

[dosbox]
machine = svga_s3
memsize = 64

[cpu]
core = dynamic
cycles = max

[video]
vmemsize = 8
allow highres vesa modes = true
allow 32bpp vesa modes = true

[dos]
# long file names: apps/dosprompt.js exceeds 8.3; DOjS fopen() needs LFN
lfn = true
ver = 7.1

[autoexec]
mount C vendor/dojs
mount D .
D:
call RUN.BAT
