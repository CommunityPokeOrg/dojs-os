# DOSBox-X config for running dojs-os under DOjS.
#
# Usage (host):
#   tools/build-zip.sh                 -> dist/DOJSOS.ZIP
#   tools/get-dojs.sh                  -> vendor/dojs/... (DOJS.EXE etc.)
#   dosbox-x -conf dosbox/dosbox-x.conf
#
# The config mounts vendor/dojs as C: (so DOJS.EXE lives at C:\DOJS.EXE)
# and dist/ as D:. RUN.BAT on D: launches the OS.

[sdl]
# DOjS sets its own VESA mode; window size is host-side.
output = opengl
autolock = true

[dosbox]
machine = svga_s3
memsize = 64

[cpu]
core = dynamic
cycles = max

[video]
# DOjS supports 640x480 or 320x240 at 8/16/24/32 bpp; VESA needed for >8bpp.
vmemsize = 8
allow highres vesa modes = true
allow 32bpp vesa modes = true

[dos]
# long file name support helps Require() find .js modules in zips
lfn = true
ver = 7.1

[autoexec]
mount C vendor/dojs
mount D dist
D:
call RUN.BAT
