# DOSBox-X config for running dojs-os under DOjS.
#
# Usage (host):
#   tools/build-zip.sh                 -> dist/DOJSOS.ZIP
#   dosbox-x -conf dosbox/dosbox-x.conf
#
# The DOjS runtime is vendored in vendor/dojs (see vendor/dojs/README.TXT);
# tools/get-dojs.sh only needed to upgrade it or fetch the full release.
#
# The config mounts vendor/dojs as C: (so DOJS.EXE lives at C:\DOJS.EXE)
# and dist/ as D:. build-zip.sh emits dist/RUN.BAT, which launches the OS.
#
# For unzipped live debugging (host-editable source, no zip rebuild)
# use dosbox/dosbox-x-dev.conf instead.

[sdl]
# DOjS sets its own VESA mode; window size is host-side.
output = opengl
autolock = true

[dosbox]
machine = svga_s3
memsize = 64

[cpu]
core = dynamic
cycles = max

[video]
# DOjS supports 640x480 or 320x240 at 8/16/24/32 bpp; VESA needed for >8bpp.
vmemsize = 8
allow highres vesa modes = true
allow 32bpp vesa modes = true

[dos]
# long file name support helps Require() find .js modules in zips
lfn = true
ver = 7.1

[autoexec]
mount C vendor/dojs
mount D dist
D:
call RUN.BAT
